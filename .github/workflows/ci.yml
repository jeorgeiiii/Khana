name: Zomoro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: false
          tags: zomoro-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: false
          tags: zomoro-frontend:ci